<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="sans-serif">
  <rect x="0" y="0" width="1400" height="620" fill="white"/>
  <rect x="4" y="4" width="1392" height="612" fill="none" stroke="black" stroke-width="2"/>
  <text x="700" y="45" font-size="28" text-anchor="middle" font-weight="bold">慣性區域的型式</text>

  <!-- ============ LEFT: 水平式橫向整理格局 ============ -->
  <g>
    <!-- rising staircase into the range -->
    <g stroke="black" stroke-width="2">
      <line x1="60" y1="470" x2="60" y2="560"/><rect x="50" y="500" width="20" height="45" fill="#c0272d"/>
      <line x1="100" y1="410" x2="100" y2="500"/><rect x="90" y="430" width="20" height="55" fill="black"/>
      <line x1="140" y1="360" x2="140" y2="450"/><rect x="130" y="380" width="20" height="55" fill="#c0272d"/>
      <line x1="180" y1="330" x2="180" y2="420"/><rect x="170" y="345" width="20" height="55" fill="black"/>
      <line x1="220" y1="310" x2="220" y2="400"/><rect x="210" y="330" width="20" height="45" fill="#c0272d"/>
    </g>
    <!-- yellow consolidation band -->
    <rect x="250" y="280" width="230" height="200" fill="#e9df8f" opacity="0.7"/>
    <g stroke="black" stroke-width="2">
      <line x1="270" y1="300" x2="270" y2="380"/><rect x="260" y="320" width="20" height="40" fill="black"/>
      <line x1="310" y1="295" x2="310" y2="375"/><rect x="300" y="310" width="20" height="45" fill="#c0272d"/>
      <line x1="350" y1="300" x2="350" y2="400"/><rect x="340" y="330" width="20" height="45" fill="black"/>
      <line x1="390" y1="320" x2="390" y2="420"/><rect x="380" y="345" width="20" height="50" fill="#c0272d"/>
      <line x1="430" y1="340" x2="430" y2="440"/><rect x="420" y="365" width="20" height="45" fill="black"/>
      <line x1="465" y1="350" x2="465" y2="450"/><rect x="455" y="380" width="20" height="45" fill="black"/>
    </g>
    <!-- breakout candle -->
    <line x1="510" y1="150" x2="510" y2="400" stroke="black" stroke-width="2"/>
    <rect x="497" y="160" width="26" height="220" fill="#c0272d"/>
    <rect x="440" y="90" width="140" height="45" rx="8" fill="#e9e9e9" stroke="#888"/>
    <text x="510" y="120" font-size="20" text-anchor="middle">大漲K線</text>
    <line x1="510" y1="135" x2="510" y2="160" stroke="#888" stroke-width="1.5"/>
    <text x="280" y="580" font-size="24" text-anchor="middle" font-weight="bold">水平式橫向整理格局</text>
  </g>

  <!-- ============ RIGHT: 下斜式整理格局 ============ -->
  <g transform="translate(680,0)">
    <!-- rising staircase into the range -->
    <g stroke="black" stroke-width="2">
      <line x1="60" y1="420" x2="60" y2="500"/><rect x="50" y="440" width="20" height="50" fill="black"/>
      <line x1="100" y1="400" x2="100" y2="480"/><rect x="90" y="420" width="20" height="45" fill="black"/>
      <line x1="140" y1="420" x2="140" y2="480"/><rect x="130" y="440" width="20" height="30" fill="#c0272d"/>
      <line x1="180" y1="380" x2="180" y2="460"/><rect x="170" y="400" width="20" height="45" fill="black"/>
    </g>
    <!-- yellow range with descending resistance line -->
    <rect x="210" y="160" width="290" height="330" fill="#e9df8f" opacity="0.7"/>
    <g stroke="black" stroke-width="2">
      <line x1="240" y1="170" x2="240" y2="320"/><rect x="230" y="185" width="20" height="120" fill="black"/>
      <line x1="280" y1="220" x2="280" y2="290"/><rect x="270" y="235" width="20" height="40" fill="black"/>
      <line x1="320" y1="215" x2="320" y2="280"/><rect x="310" y="225" width="20" height="35" fill="black"/>
      <line x1="360" y1="230" x2="360" y2="300"/><rect x="350" y="245" width="20" height="40" fill="#c0272d"/>
      <line x1="400" y1="200" x2="400" y2="330"/><rect x="390" y="215" width="20" height="105" fill="black"/>
      <line x1="440" y1="300" x2="440" y2="400"/><rect x="430" y="330" width="20" height="45" fill="#c0272d"/>
      <line x1="470" y1="330" x2="470" y2="400"/><rect x="460" y="350" width="20" height="35" fill="black"/>
    </g>
    <!-- descending dashed resistance trendline connecting the peaks -->
    <line x1="245" y1="168" x2="495" y2="345" stroke="#333" stroke-width="2" stroke-dasharray="8,5"/>
    <!-- inverted-N shaped orange correction line -->
    <path d="M255,300 L370,470 L410,410 L470,530" fill="none" stroke="#d2691e" stroke-width="3"/>
    <!-- breakout candle at right edge -->
    <line x1="530" y1="130" x2="530" y2="360" stroke="black" stroke-width="2"/>
    <rect x="517" y="140" width="26" height="200" fill="#c0272d"/>
    <rect x="470" y="70" width="140" height="45" rx="8" fill="#e9e9e9" stroke="#888"/>
    <text x="540" y="100" font-size="20" text-anchor="middle">大漲K線</text>
    <line x1="540" y1="115" x2="530" y2="140" stroke="#888" stroke-width="1.5"/>
    <text x="330" y="580" font-size="24" text-anchor="middle" font-weight="bold">下斜式整理格局</text>
  </g>
</svg>
