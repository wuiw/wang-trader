<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="760" fill="white"/>
  <rect x="4" y="4" width="892" height="752" fill="none" stroke="black" stroke-width="2"/>

  <!-- Row 1: 陽線 (red) -->
  <!-- 大陽線 -->
  <text x="85" y="70" font-size="20" text-anchor="middle">收盤</text>
  <line x1="60" y1="65" x2="100" y2="80" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="95" y="75" width="70" height="150" fill="#c0272d" stroke="black" stroke-width="2"/>
  <text x="60" y="170" font-size="20" text-anchor="middle">實體</text>
  <path d="M75,80 Q55,150 75,220" fill="none" stroke="black" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="85" y="250" font-size="20" text-anchor="middle">開盤</text>
  <line x1="60" y1="245" x2="100" y2="228" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="280" font-size="22" text-anchor="middle" font-weight="bold">大陽線</text>

  <!-- 中陽線 -->
  <text x="330" y="40" font-size="20" text-anchor="middle">最高價</text>
  <line x1="330" y1="48" x2="330" y2="230" stroke="black" stroke-width="1.5"/>
  <text x="345" y="70" font-size="20">上影線</text>
  <path d="M340,50 Q365,60 340,80" fill="none" stroke="black" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="295" y="80" width="70" height="90" fill="#c0272d" stroke="black" stroke-width="2"/>
  <text x="345" y="195" font-size="20">下影線</text>
  <path d="M340,175 Q365,185 340,205" fill="none" stroke="black" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="330" y="250" font-size="20" text-anchor="middle">最低價</text>
  <text x="330" y="280" font-size="22" text-anchor="middle" font-weight="bold">中陽線</text>

  <!-- 小陽線 -->
  <rect x="770" y="150" width="80" height="24" fill="#c0272d" stroke="black" stroke-width="2"/>
  <line x1="810" y1="130" x2="810" y2="195" stroke="black" stroke-width="1.5"/>
  <text x="810" y="280" font-size="22" text-anchor="middle" font-weight="bold">小陽線</text>

  <!-- Row 2: 陰線 (black) -->
  <!-- 大陰線 -->
  <text x="85" y="345" font-size="20" text-anchor="middle">開盤</text>
  <line x1="60" y1="340" x2="100" y2="355" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="95" y="350" width="70" height="150" fill="black" stroke="black" stroke-width="2"/>
  <text x="60" y="445" font-size="20" text-anchor="middle">實體</text>
  <path d="M75,355 Q55,425 75,495" fill="none" stroke="black" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="85" y="525" font-size="20" text-anchor="middle">收盤</text>
  <line x1="60" y1="520" x2="100" y2="503" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="555" font-size="22" text-anchor="middle" font-weight="bold">大陰線</text>

  <!-- 中陰線 -->
  <text x="330" y="315" font-size="20" text-anchor="middle">最高價</text>
  <line x1="330" y1="323" x2="330" y2="505" stroke="black" stroke-width="1.5"/>
  <text x="345" y="345" font-size="20">上影線</text>
  <path d="M340,325 Q365,335 340,355" fill="none" stroke="black" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="295" y="355" width="70" height="90" fill="black" stroke="black" stroke-width="2"/>
  <text x="345" y="470" font-size="20">下影線</text>
  <path d="M340,450 Q365,460 340,480" fill="none" stroke="black" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="330" y="525" font-size="20" text-anchor="middle">最低價</text>
  <text x="330" y="555" font-size="22" text-anchor="middle" font-weight="bold">中陰線</text>

  <!-- 小陰線 -->
  <rect x="770" y="415" width="80" height="24" fill="black" stroke="black" stroke-width="2"/>
  <line x1="810" y1="395" x2="810" y2="460" stroke="black" stroke-width="1.5"/>
  <text x="810" y="555" font-size="22" text-anchor="middle" font-weight="bold">小陰線</text>

  <!-- Row 3: reversal-line shapes -->
  <!-- 十字線 -->
  <line x1="130" y1="600" x2="130" y2="720" stroke="black" stroke-width="3"/>
  <line x1="70" y1="655" x2="190" y2="655" stroke="black" stroke-width="3"/>
  <text x="130" y="750" font-size="22" text-anchor="middle" font-weight="bold">十字線</text>

  <!-- T字線 -->
  <line x1="400" y1="600" x2="400" y2="720" stroke="black" stroke-width="3"/>
  <line x1="345" y1="600" x2="455" y2="600" stroke="black" stroke-width="3"/>
  <text x="400" y="750" font-size="22" text-anchor="middle" font-weight="bold">T字線</text>

  <!-- 倒T線 -->
  <line x1="810" y1="600" x2="810" y2="720" stroke="black" stroke-width="3"/>
  <line x1="755" y1="720" x2="865" y2="720" stroke="black" stroke-width="3"/>
  <text x="810" y="750" font-size="22" text-anchor="middle" font-weight="bold">倒T線</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
    </marker>
  </defs>
</svg>
