<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="sans-serif">
  <rect x="0" y="0" width="1200" height="640" fill="white"/>
  <rect x="4" y="4" width="1192" height="632" fill="none" stroke="black" stroke-width="2"/>

  <!-- ===== Top row: 突破前N日區間高 (breakout above N-day range high) ===== -->
  <!-- Panel 1: 前1日 -->
  <g>
    <rect x="60" y="60" width="100" height="140" fill="#e9df8f" stroke="#999"/>
    <line x1="105" y1="70" x2="105" y2="190" stroke="black" stroke-width="2"/>
    <rect x="85" y="95" width="40" height="70" fill="black"/>
    <line x1="60" y1="70" x2="230" y2="70" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="180" y="15" width="45" height="70" fill="#c0272d"/>
    <text x="115" y="230" font-size="20" text-anchor="middle">K線收盤</text>
    <text x="115" y="256" font-size="20" text-anchor="middle">突破前1日區間高</text>
  </g>

  <!-- Panel 2: 前2日 -->
  <g transform="translate(340,0)">
    <rect x="60" y="60" width="130" height="140" fill="#e9df8f" stroke="#999"/>
    <line x1="90" y1="65" x2="90" y2="190" stroke="black" stroke-width="2"/>
    <rect x="70" y="90" width="40" height="80" fill="black"/>
    <rect x="120" y="135" width="40" height="45" fill="black"/>
    <line x1="60" y1="70" x2="260" y2="70" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="210" y="15" width="45" height="70" fill="#c0272d"/>
    <text x="130" y="230" font-size="20" text-anchor="middle">K線收盤</text>
    <text x="130" y="256" font-size="20" text-anchor="middle">突破前2日區間高</text>
  </g>

  <!-- Panel 3: 前4日 -->
  <g transform="translate(700,0)">
    <rect x="60" y="55" width="170" height="145" fill="#e9df8f" stroke="#999"/>
    <line x1="85" y1="60" x2="85" y2="185" stroke="black" stroke-width="2"/>
    <rect x="65" y="80" width="40" height="90" fill="black"/>
    <rect x="115" y="120" width="35" height="45" fill="#c0272d"/>
    <rect x="160" y="95" width="40" height="70" fill="black"/>
    <line x1="60" y1="65" x2="300" y2="65" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="250" y="10" width="45" height="70" fill="#c0272d"/>
    <text x="160" y="230" font-size="20" text-anchor="middle">K線收盤</text>
    <text x="160" y="256" font-size="20" text-anchor="middle">突破前4日區間高</text>
  </g>

  <!-- ===== Bottom row: 跌破前N日區間低 (breakdown below N-day range low) ===== -->
  <!-- Panel 4: 前1日 -->
  <g transform="translate(0,330)">
    <rect x="60" y="20" width="100" height="140" fill="#e9df8f" stroke="#999"/>
    <line x1="105" y1="30" x2="105" y2="150" stroke="black" stroke-width="2"/>
    <rect x="85" y="60" width="40" height="90" fill="#c0272d"/>
    <line x1="60" y1="150" x2="230" y2="150" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="180" y="145" width="45" height="120" fill="black"/>
    <text x="115" y="200" font-size="20" text-anchor="middle">K線收盤</text>
    <text x="115" y="226" font-size="20" text-anchor="middle">跌破前1日區間低</text>
  </g>

  <!-- Panel 5: 前2日 -->
  <g transform="translate(340,330)">
    <rect x="60" y="0" width="140" height="160" fill="#e9df8f" stroke="#999"/>
    <line x1="150" y1="5" x2="150" y2="90" stroke="black" stroke-width="2"/>
    <rect x="130" y="45" width="40" height="45" fill="black"/>
    <rect x="75" y="90" width="40" height="70" fill="#c0272d"/>
    <line x1="60" y1="160" x2="270" y2="160" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="220" y="155" width="45" height="120" fill="black"/>
    <text x="140" y="200" font-size="20" text-anchor="middle">K線收盤</text>
    <text x="140" y="226" font-size="20" text-anchor="middle">跌破前2日區間低</text>
  </g>

  <!-- Panel 6: 前4日 -->
  <g transform="translate(700,330)">
    <rect x="60" y="0" width="170" height="160" fill="#e9df8f" stroke="#999"/>
    <rect x="70" y="90" width="35" height="70" fill="#c0272d"/>
    <line x1="140" y1="10" x2="140" y2="120" stroke="black" stroke-width="2"/>
    <rect x="120" y="70" width="40" height="50" fill="black"/>
    <rect x="175" y="60" width="35" height="60" fill="#c0272d"/>
    <line x1="60" y1="160" x2="300" y2="160" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="250" y="155" width="45" height="120" fill="black"/>
    <text x="160" y="200" font-size="20" text-anchor="middle">K線收盤</text>
    <text x="160" y="226" font-size="20" text-anchor="middle">跌破前4日區間低</text>
  </g>
</svg>
