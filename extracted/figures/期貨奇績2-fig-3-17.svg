<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="sans-serif">
<rect width="1040" height="640" fill="white"/>
<rect x="8" y="8" width="1024" height="624" fill="none" stroke="#555" stroke-width="2"/>
<line x1="520" y1="8" x2="520" y2="632" stroke="#555" stroke-width="1.5"/>

<!-- ===================== LEFT PANEL: buy signal (RSI breaks above 50) ===================== -->
<g>
  <!-- small idealised candles: consolidation then breakout -->
  <!-- consolidation candles -->
  <g stroke="#c0392b" fill="#c0392b">
    <line x1="60" y1="330" x2="60" y2="380"/><rect x="55" y="340" width="10" height="30"/>
    <line x1="80" y1="320" x2="80" y2="375"/><rect x="75" y="330" width="10" height="35" fill="#111" stroke="#111"/>
    <line x1="100" y1="325" x2="100" y2="378"/><rect x="95" y="335" width="10" height="32"/>
    <line x1="120" y1="315" x2="120" y2="372"/><rect x="115" y="322" width="10" height="38" fill="#111" stroke="#111"/>
  </g>
  <!-- breakout candle (large red) -->
  <line x1="150" y1="200" x2="150" y2="330" stroke="#c0392b"/>
  <rect x="143" y="215" width="14" height="105" fill="#c0392b"/>
  <!-- more candles continuing up -->
  <g stroke="#c0392b" fill="#c0392b">
    <line x1="175" y1="195" x2="175" y2="235"/><rect x="170" y="200" width="10" height="25"/>
    <line x1="195" y1="188" x2="195" y2="228"/><rect x="190" y="195" width="10" height="24" fill="#111" stroke="#111"/>
    <line x1="215" y1="180" x2="215" y2="222"/><rect x="210" y="186" width="10" height="26"/>
  </g>
  <!-- 訊號 candle (the "過一高" signal candle, tall red) -->
  <line x1="240" y1="100" x2="240" y2="215" stroke="#c0392b"/>
  <rect x="233" y="115" width="14" height="90" fill="#c0392b"/>
  <!-- continuing rally candles -->
  <g stroke="#c0392b" fill="#c0392b">
    <line x1="265" y1="90" x2="265" y2="130"/><rect x="260" y="95" width="10" height="26"/>
    <line x1="285" y1="75" x2="285" y2="115"/><rect x="280" y="80" width="10" height="26"/>
    <line x1="305" y1="65" x2="305" y2="105"/><rect x="300" y="70" width="10" height="26"/>
    <line x1="325" y1="55" x2="325" y2="95"/><rect x="320" y="60" width="10" height="26" fill="#111" stroke="#111"/>
    <line x1="345" y1="50" x2="345" y2="90"/><rect x="340" y="55" width="10" height="26"/>
    <line x1="365" y1="55" x2="365" y2="95"/><rect x="360" y="60" width="10" height="26"/>
    <line x1="385" y1="60" x2="385" y2="100"/><rect x="380" y="65" width="10" height="26" fill="#111" stroke="#111"/>
    <line x1="405" y1="58" x2="405" y2="98"/><rect x="400" y="63" width="10" height="26"/>
  </g>
  <!-- black step (PVT-like) line -->
  <polyline points="150,410 195,410 195,388 405,388" fill="none" stroke="#111" stroke-width="2"/>
  <!-- 大於10點 dashed curved arrows -->
  <path d="M65,335 Q100,300 145,220" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar1)"/>
  <text x="15" y="290" font-size="15" fill="#111">大於10點</text>
  <path d="M125,320 Q150,290 175,235" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar1)"/>
  <text x="115" y="345" font-size="15" fill="#111">大於10點</text>
  <!-- 訊號要過一高 label -->
  <text x="250" y="150" font-size="15" fill="#111">訊號要過一高</text>
  <!-- 買 callout -->
  <rect x="180" y="150" width="40" height="34" rx="6" fill="white" stroke="#c0392b"/>
  <text x="188" y="173" font-size="16" fill="#c0392b">買</text>
  <path d="M215,182 L240,208" stroke="#c0392b" stroke-width="1.5" fill="none"/>
  <!-- vertical dashed line down to RSI -->
  <line x1="240" y1="215" x2="240" y2="530" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#ar2)"/>
  <!-- RSI axis line D -->
  <line x1="30" y1="420" x2="500" y2="420" stroke="#111" stroke-width="1.5"/>
  <text x="12" y="424" font-size="13" fill="#111">D</text>
  <line x1="30" y1="440" x2="500" y2="440" stroke="#333" stroke-width="1"/>
  <text x="10" y="444" font-size="11" fill="#111">S1</text>
  <!-- RSI squiggly line -->
  <polyline points="35,540 55,500 75,520 95,480 115,555 135,585 155,540 175,510 195,530 215,470 235,555 255,520 275,470 295,520 315,540 335,480 355,490 375,545 395,470 415,485 435,460"
    fill="none" stroke="#4a6a52" stroke-width="2"/>
  <line x1="30" y1="560" x2="500" y2="560" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="248" y="576" font-size="14" fill="#111">50</text>
  <text x="30" y="612" font-size="16" fill="#111">價格拉回RSI破50</text>
</g>

<!-- ===================== RIGHT PANEL: sell signal (RSI breaks below 50) ===================== -->
<g>
  <!-- black step (PVT-like) line, descending at top -->
  <polyline points="555,110 640,110 640,160 690,160 690,195 805,195" fill="none" stroke="#c0392b" stroke-width="2"/>
  <!-- consolidation candles at top -->
  <g stroke="#111" fill="#111">
    <line x1="560" y1="205" x2="560" y2="250"/><rect x="555" y="212" width="10" height="30"/>
    <line x1="580" y1="200" x2="580" y2="245"/><rect x="575" y="207" width="10" height="30" fill="#c0392b" stroke="#c0392b"/>
    <line x1="600" y1="210" x2="600" y2="255"/><rect x="595" y="217" width="10" height="30"/>
    <line x1="620" y1="215" x2="620" y2="260"/><rect x="615" y="222" width="10" height="30" fill="#c0392b" stroke="#c0392b"/>
  </g>
  <!-- breakdown candle (large black) -->
  <line x1="650" y1="250" x2="650" y2="380" stroke="#111"/>
  <rect x="643" y="255" width="14" height="105" fill="#111"/>
  <!-- more candles continuing down -->
  <g stroke="#111" fill="#111">
    <line x1="675" y1="370" x2="675" y2="410"/><rect x="670" y="375" width="10" height="26"/>
    <line x1="695" y1="380" x2="695" y2="420"/><rect x="690" y="385" width="10" height="26" fill="#c0392b" stroke="#c0392b"/>
    <line x1="715" y1="392" x2="715" y2="432"/><rect x="710" y="397" width="10" height="26"/>
  </g>
  <!-- 訊號 candle (breaks the low) -->
  <line x1="740" y1="420" x2="740" y2="510" stroke="#111"/>
  <rect x="733" y="425" width="14" height="70" fill="#111"/>
  <!-- continuing decline candles -->
  <g stroke="#111" fill="#111">
    <line x1="765" y1="500" x2="765" y2="540"/><rect x="760" y="505" width="10" height="26"/>
    <line x1="785" y1="505" x2="785" y2="545"/><rect x="780" y="510" width="10" height="26" fill="#c0392b" stroke="#c0392b"/>
    <line x1="805" y1="510" x2="805" y2="550"/><rect x="800" y="515" width="10" height="26"/>
    <line x1="825" y1="500" x2="825" y2="540"/><rect x="820" y="505" width="10" height="26" fill="#c0392b" stroke="#c0392b"/>
    <line x1="845" y1="480" x2="845" y2="520"/><rect x="840" y="485" width="10" height="26"/>
    <line x1="865" y1="470" x2="865" y2="510"/><rect x="860" y="475" width="10" height="26" fill="#c0392b" stroke="#c0392b"/>
    <line x1="885" y1="460" x2="885" y2="500"/><rect x="880" y="465" width="10" height="26"/>
    <line x1="905" y1="470" x2="905" y2="510"/><rect x="900" y="475" width="10" height="26" fill="#c0392b" stroke="#c0392b"/>
  </g>
  <!-- 大於10點 dashed curved arrows -->
  <path d="M565,250 Q600,290 645,360" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar1)"/>
  <text x="520" y="290" font-size="15" fill="#111">大於10點</text>
  <path d="M625,262 Q655,300 680,375" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar1)"/>
  <text x="615" y="335" font-size="15" fill="#111">大於10點</text>
  <!-- 訊號要破一低 label -->
  <text x="745" y="345" font-size="15" fill="#111">訊號要破一低</text>
  <!-- 空 callout -->
  <rect x="810" y="440" width="40" height="34" rx="6" fill="white" stroke="#111"/>
  <text x="818" y="463" font-size="16" fill="#111">空</text>
  <path d="M810,455 L748,460" stroke="#111" stroke-width="1.5" fill="none"/>
  <!-- vertical dashed line down to RSI -->
  <line x1="740" y1="510" x2="740" y2="560" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#ar2)"/>
  <!-- RSI squiggly line -->
  <polyline points="535,470 555,450 575,460 595,420 615,435 635,410 655,430 675,470 695,530 715,580 735,555 755,470 775,485 795,430 815,450 835,470 855,495 875,455 895,540 915,580 935,545"
    fill="none" stroke="#4a6a52" stroke-width="2"/>
  <line x1="530" y1="500" x2="1005" y2="500" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="748" y="516" font-size="14" fill="#111">50</text>
</g>

<defs>
  <marker id="ar1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
  </marker>
  <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#999"/>
  </marker>
</defs>
<text x="520" y="632" font-size="12" fill="#888" text-anchor="middle" dy="-4">圖 3-17（示意重繪：PVT + 自訂界限RSI 買賣訊號示意圖，非真實走勢）</text>
</svg>
