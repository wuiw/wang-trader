<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- Left: 觸底收斂 (bottom convergence) -->
  <g>
    <line x1="40" y1="350" x2="380" y2="350" stroke="#000" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="10" y="356" font-size="18">10</text>
    <!-- 快速%D(45) blue line -->
    <polyline points="60,280 190,350 320,230" fill="none" stroke="#1a3a8f" stroke-width="4"/>
    <!-- 快速%D(7) red line -->
    <polyline points="90,200 190,360 300,140" fill="none" stroke="#c0392b" stroke-width="4"/>
    <!-- double arrow left top -->
    <line x1="75" y1="215" x2="75" y2="270" stroke="#000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- double arrow near bottom -->
    <line x1="192" y1="330" x2="192" y2="358" stroke="#000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="330" y="145" font-size="18" fill="#c0392b">快速%D(7)</text>
    <text x="230" y="365" font-size="18" fill="#7a3010">快速%D(45)</text>
    <text x="120" y="420" font-size="26" font-weight="bold">觸底收斂</text>
  </g>

  <!-- Right: 觸頂收斂 (top convergence) -->
  <g>
    <line x1="560" y1="150" x2="960" y2="150" stroke="#000" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="965" y="156" font-size="18">90</text>
    <!-- 快速%D(45) blue line: rises to peak at ~150 then falls -->
    <polyline points="540,240 700,150 860,240" fill="none" stroke="#1a3a8f" stroke-width="4"/>
    <!-- 快速%D(7) red line: rises to a slightly lower peak then falls, converging near top -->
    <polyline points="560,290 700,175 840,290" fill="none" stroke="#c0392b" stroke-width="4"/>
    <line x1="700" y1="152" x2="700" y2="185" stroke="#000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="580" y1="255" x2="580" y2="285" stroke="#000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="740" y="120" font-size="18" fill="#7a3010">快速%D(45)</text>
    <text x="600" y="315" font-size="18" fill="#c0392b">快速%D(7)</text>
    <text x="660" y="420" font-size="26" font-weight="bold">觸頂收斂</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
    </marker>
  </defs>
</svg>
