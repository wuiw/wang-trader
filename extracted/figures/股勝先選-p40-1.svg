<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- 區間高點 dashed line -->
  <line x1="60" y1="220" x2="560" y2="220" stroke="#2b3a67" stroke-width="4" stroke-dasharray="14 8"/>
  <text x="580" y="226" font-size="20" fill="#111111">區間高點</text>

  <!-- 乖離值10 dashed line -->
  <line x1="60" y1="400" x2="560" y2="400" stroke="#2b3a67" stroke-width="4" stroke-dasharray="14 8"/>
  <text x="580" y="406" font-size="20" fill="#111111">乖離值10</text>

  <!-- five stick figures with diamond-outline arms standing in a row between the two lines -->
  <g stroke="#333333" stroke-width="3" fill="none">
    <!-- figure 1 (red torso) -->
    <path d="M100 300 L70 260 M100 300 L130 260 M85 340 L100 300 M115 340 L100 300" />
    <!-- figure 2 (black torso) -->
    <path d="M175 300 L145 260 M175 300 L205 260 M160 340 L175 300 M190 340 L175 300" />
    <!-- figure 3 (red) -->
    <path d="M250 300 L220 260 M250 300 L280 260 M235 340 L250 300 M265 340 L250 300" />
    <!-- figure 4 (red) -->
    <path d="M325 300 L295 260 M325 300 L355 260 M310 340 L325 300 M340 340 L325 300" />
    <!-- figure 5 (red) -->
    <path d="M400 300 L370 260 M400 300 L430 260 M385 340 L400 300 M415 340 L400 300" />
  </g>
  <rect x="88" y="255" width="24" height="45" fill="#b5121b"/>
  <rect x="163" y="255" width="24" height="45" fill="#111111"/>
  <rect x="238" y="255" width="24" height="45" fill="#b5121b"/>
  <rect x="313" y="255" width="24" height="45" fill="#b5121b"/>
  <rect x="388" y="255" width="24" height="45" fill="#b5121b"/>

  <!-- ladder climbing from 乖離值10 line up toward the row of figures -->
  <g stroke="#3a5a4a" stroke-width="4">
    <line x1="270" y1="405" x2="270" y2="560" />
    <line x1="310" y1="405" x2="310" y2="560" />
    <line x1="270" y1="430" x2="310" y2="430" stroke="#b5121b" stroke-width="10"/>
    <line x1="270" y1="475" x2="310" y2="475" stroke="#b5121b" stroke-width="10"/>
    <line x1="270" y1="520" x2="310" y2="520" stroke="#b5121b" stroke-width="10"/>
  </g>
  <!-- climbing stick figure on the ladder -->
  <rect x="278" y="365" width="24" height="45" fill="#b5121b"/>
  <path d="M278 375 L255 390 M302 375 L320 360 M290 410 L275 440 M290 410 L305 440"
        stroke="#333333" stroke-width="3" fill="none"/>

  <!-- right scene: cliff / diving board shape -->
  <path d="M610 500 L610 340 L820 340" stroke="#111111" stroke-width="6" fill="none"/>
  <!-- falling figure below the ledge -->
  <rect x="600" y="440" width="20" height="38" fill="#b5121b"/>
  <path d="M600 448 L580 460 M620 448 L640 460 M608 478 L595 500 M615 478 L628 500"
        stroke="#333333" stroke-width="3" fill="none"/>
  <line x1="610" y1="430" x2="610" y2="500" stroke="#2b3a67" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- jumping figure at the top of the ledge, arms raised -->
  <rect x="800" y="255" width="22" height="42" fill="#b5121b"/>
  <path d="M800 262 L780 235 M822 262 L842 235 M808 297 L790 325 M814 297 L830 322"
        stroke="#333333" stroke-width="3" fill="none"/>

  <text x="450" y="600" text-anchor="middle" font-size="20" fill="#333333">
    示意圖：個股沿乖離值10之上排隊爬升（左），追高若無視風險宛如躍下懸崖（右）
  </text>
</svg>
