<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <rect x="8" y="8" width="884" height="604" fill="none" stroke="#2b2470" stroke-width="3"/>

  <!-- Left half: bar-chart boxes comparison -->
  <text x="170" y="55" font-size="20" font-weight="bold" fill="#c0102a" text-anchor="middle">領先創新高</text>
  <path d="M 150 65 Q 175 85 195 105" fill="none" stroke="#2e6b3e" stroke-width="4" marker-end="url(#arrow2)"/>
  <rect x="195" y="95" width="14" height="90" fill="#c0102a"/>

  <rect x="55" y="130" width="220" height="150" fill="#0f3d2e" stroke="#e0c840" stroke-width="4"/>
  <g stroke="#8b1a1a" stroke-width="4">
    <line x1="75" y1="150" x2="75" y2="230"/>
    <line x1="95" y1="160" x2="95" y2="245"/>
    <line x1="115" y1="145" x2="115" y2="220"/>
    <line x1="135" y1="170" x2="135" y2="255"/>
    <line x1="155" y1="150" x2="155" y2="235"/>
    <line x1="175" y1="165" x2="175" y2="250"/>
    <line x1="195" y1="145" x2="195" y2="225"/>
    <line x1="215" y1="160" x2="215" y2="240"/>
    <line x1="235" y1="150" x2="235" y2="225"/>
    <line x1="255" y1="155" x2="255" y2="235"/>
  </g>
  <text x="30" y="215" font-size="20" font-weight="bold" fill="#c0102a" text-anchor="end">個股</text>

  <line x1="202" y1="185" x2="202" y2="410" stroke="#2b2470" stroke-width="4" marker-end="url(#arrow2)" marker-start="url(#arrow2start)"/>

  <rect x="55" y="410" width="220" height="150" fill="#0f3d2e" stroke="#e0c840" stroke-width="4"/>
  <g stroke="#8b1a1a" stroke-width="4">
    <line x1="75" y1="430" x2="75" y2="505"/>
    <line x1="95" y1="440" x2="95" y2="520"/>
    <line x1="115" y1="425" x2="115" y2="500"/>
    <line x1="135" y1="450" x2="135" y2="530"/>
    <line x1="155" y1="430" x2="155" y2="510"/>
    <line x1="175" y1="445" x2="175" y2="525"/>
    <line x1="195" y1="425" x2="195" y2="505"/>
    <line x1="215" y1="440" x2="215" y2="515"/>
    <line x1="235" y1="430" x2="235" y2="505"/>
  </g>
  <rect x="245" y="470" width="16" height="60" fill="#5a1010"/>
  <text x="30" y="495" font-size="20" font-weight="bold" fill="#c0102a" text-anchor="end">大盤</text>

  <text x="165" y="595" font-size="20" font-weight="bold" fill="#c0102a" text-anchor="middle">比對最近的波峰高點</text>

  <!-- divider -->
  <line x1="450" y1="20" x2="450" y2="600" stroke="#2b2470" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Right half: zig-zag wave comparison -->
  <text x="700" y="55" font-size="20" font-weight="bold" fill="#c0102a" text-anchor="middle">領先創新高</text>
  <path d="M 660 65 Q 690 85 705 105" fill="none" stroke="#2e6b3e" stroke-width="4" marker-end="url(#arrow2)"/>

  <text x="480" y="235" font-size="20" font-weight="bold" fill="#c0102a">個股</text>
  <polyline points="520,290 585,140 640,230 690,190 730,260" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="640" cy="230" r="16" fill="#ffffff" stroke="#c0102a" stroke-width="2"/>
  <text x="640" y="236" font-size="16" font-weight="bold" fill="#c0102a" text-anchor="middle">2</text>
  <circle cx="690" cy="190" r="16" fill="#ffffff" stroke="#c0102a" stroke-width="2"/>
  <text x="690" y="196" font-size="16" font-weight="bold" fill="#c0102a" text-anchor="middle">1</text>
  <line x1="640" y1="230" x2="850" y2="230" stroke="#c0102a" stroke-width="4" stroke-dasharray="10,6"/>
  <rect x="726" y="150" width="14" height="80" fill="#c0102a"/>
  <line x1="733" y1="230" x2="733" y2="390" stroke="#2b2470" stroke-width="4" marker-end="url(#arrow2)"/>

  <text x="480" y="440" font-size="20" font-weight="bold" fill="#c0102a">大盤</text>
  <polyline points="520,495 585,345 640,435 690,395 730,430" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="640" cy="435" r="16" fill="#ffffff" stroke="#c0102a" stroke-width="2"/>
  <text x="640" y="441" font-size="16" font-weight="bold" fill="#c0102a" text-anchor="middle">2</text>
  <circle cx="690" cy="395" r="16" fill="#ffffff" stroke="#2e6b3e" stroke-width="2"/>
  <text x="690" y="401" font-size="16" font-weight="bold" fill="#2e6b3e" text-anchor="middle">1</text>
  <line x1="640" y1="435" x2="850" y2="435" stroke="#c0102a" stroke-width="4" stroke-dasharray="10,6"/>
  <rect x="726" y="405" width="14" height="30" fill="#8b1a1a"/>

  <text x="695" y="595" font-size="19" font-weight="bold" fill="#c0102a" text-anchor="middle">當最近波峰已過，比對更前的波峰</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,10 L10,0 Z" fill="context-stroke"/>
    </marker>
    <marker id="arrow2start" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,10 L5,0 L10,10 Z" fill="context-stroke"/>
    </marker>
  </defs>
</svg>
