<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="white"/>
  <rect x="4" y="4" width="992" height="512" fill="none" stroke="black" stroke-width="2"/>

  <!-- Group 1: 黑執帶 -->
  <rect x="110" y="217.6" width="44" height="167.7" fill="#c0272d"/>
  <rect x="170" y="0" width="44" height="200" fill="black"/>
  <rect x="90" y="440" width="140" height="40" rx="6" fill="#d9d9d9" stroke="#888"/>
  <text x="160" y="466" font-size="22" text-anchor="middle">黑執帶</text>

  <!-- Group 2: 覆蓋線 -->
  <rect x="360" y="217.6" width="44" height="167.7" fill="#c0272d"/>
  <rect x="420" y="114.7" width="44" height="182.3" fill="black"/>
  <rect x="340" y="440" width="140" height="40" rx="6" fill="#d9d9d9" stroke="#888"/>
  <text x="410" y="466" font-size="22" text-anchor="middle">覆蓋線</text>

  <!-- Group 3: 陰線吞噬線 -->
  <rect x="610" y="167.6" width="44" height="167.7" fill="#c0272d"/>
  <rect x="670" y="135.3" width="44" height="264.7" fill="black"/>
  <rect x="585" y="440" width="150" height="40" rx="6" fill="#d9d9d9" stroke="#888"/>
