<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="sans-serif">
<rect width="1400" height="620" fill="#ffffff"/>
<rect x="10" y="10" width="1380" height="600" fill="none" stroke="#000" stroke-width="2"/>
<text x="560" y="35" font-size="22" font-weight="bold">圖4-18</text>

<!-- ============ LEFT PANEL: 買 example, 關卡上8根 vs 關卡下4根 ============ -->
<text x="230" y="90" font-size="20">線上8根</text>
<text x="150" y="470" font-size="20">線下4根</text>
<line x1="30" y1="320" x2="480" y2="320" stroke="#333" stroke-width="2"/>
<text x="20" y="326" font-size="20">關卡</text>

<!-- candles before A: below 關卡 -->
<g stroke="#000" stroke-width="2">
<line x1="60" y1="360" x2="60" y2="440"/><rect x="50" y="375" width="18" height="45" fill="#c0392b"/>
<line x1="90" y1="380" x2="90" y2="480"/><rect x="80" y="395" width="18" height="55" fill="#000"/>
</g>
<!-- A: breakout candle through 關卡 -->
<g stroke="#000" stroke-width="2">
<line x1="130" y1="300" x2="130" y2="410"/><rect x="120" y="315" width="18" height="70" fill="#c0392b"/>
</g>
<text x="118" y="440" font-size="18">Ⓐ</text>
<!-- candles 1..8 above 關卡, forming peak then pullback then breakout -->
<g stroke="#000" stroke-width="2">
<line x1="165" y1="200" x2="165" y2="300"/><rect x="155" y="215" width="18" height="60" fill="#c0392b"/>
<line x1="195" y1="170" x2="195" y2="260"/><rect x="185" y="185" width="18" height="55" fill="#000"/>
<line x1="225" y1="230" x2="225" y2="300"/><rect x="215" y="245" width="18" height="35" fill="#c0392b"/>
<line x1="255" y1="280" x2="255" y2="340"/><rect x="245" y="295" width="18" height="30" fill="#000"/>
<line x1="285" y1="260" x2="285" y2="320"/><rect x="275" y="275" width="18" height="30" fill="#c0392b"/>
<line x1="315" y1="220" x2="315" y2="290"/><rect x="305" y="235" width="18" height="40" fill="#000"/>
<line x1="345" y1="270" x2="345" y2="330"/><rect x="335" y="285" width="18" height="30" fill="#c0392b"/>
</g>
<!-- circled 1 at first peak -->
<text x="220" y="150" font-size="18">①</text>
<line x1="225" y1="230" x2="225" y2="160" stroke="#000" stroke-width="1"/>
<!-- circled 2 at pullback low -->
<text x="250" y="380" font-size="18">②</text>
<line x1="255" y1="340" x2="255" y2="370" stroke="#000" stroke-width="1"/>
<!-- box around 層級2 range -->
<rect x="150" y="215" width="215" height="125" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<!-- final breakout candle 8 / ③ / B -->
<g stroke="#000" stroke-width="2">
<line x1="400" y1="120" x2="400" y2="260" stroke-width="3"/>
<rect x="390" y="140" width="20" height="100" fill="#c0392b" stroke="#000" stroke-width="2"/>
</g>
<text x="400" y="100" font-size="18">Ⓑ</text>
<text x="400" y="130" font-size="18">③</text>
<rect x="430" y="150" width="60" height="42" rx="18" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="445" y="177" font-size="20">買</text>

<!-- ============ RIGHT PANEL: 空 example, 關卡上6根 vs 關卡下15根 ============ -->
<line x1="760" y1="10" x2="760" y2="610" stroke="#ccc" stroke-width="1"/>
<text x="1000" y="150" font-size="20">線上6根</text>
<text x="1030" y="480" font-size="20">線下15根</text>
<line x1="800" y1="370" x2="1350" y2="370" stroke="#333" stroke-width="2"/>
<text x="1355" y="376" font-size="20">關卡</text>

<!-- candles above 關卡 first (downtrend leading in), then peak, pullback (A), then decline through 關卡 -->
<g stroke="#000" stroke-width="2">
<line x1="820" y1="140" x2="820" y2="220"/><rect x="810" y="155" width="18" height="50" fill="#000"/>
<line x1="850" y1="160" x2="850" y2="240"/><rect x="840" y="175" width="18" height="50" fill="#c0392b"/>
<line x1="880" y1="180" x2="880" y2="260"/><rect x="870" y="195" width="18" height="50" fill="#000"/>
</g>
<text x="900" y="200" font-size="18">①</text>
<!-- A: local low above 關卡 before minor bounce -->
<g stroke="#000" stroke-width="2">
<line x1="910" y1="230" x2="910" y2="320"/><rect x="900" y="245" width="18" height="55" fill="#c0392b"/>
</g>
<text x="905" y="345" font-size="18">Ⓐ</text>
<g stroke="#000" stroke-width="2">
<line x1="940" y1="200" x2="940" y2="290"/><rect x="930" y="215" width="18" height="55" fill="#000"/>
</g>
<text x="945" y="190" font-size="18">②</text>
<!-- box 層級2 range -->
<rect x="895" y="215" width="220" height="120" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<!-- breakdown through 關卡: candle B / ③ -->
<g stroke="#000" stroke-width="2">
<line x1="1140" y1="330" x2="1140" y2="470" stroke-width="3"/>
<rect x="1130" y="350" width="20" height="100" fill="#000" stroke="#000" stroke-width="2"/>
</g>
<text x="1140" y="500" font-size="18">③</text>
<text x="1140" y="520" font-size="18">Ⓑ</text>
<!-- continued decline candles below 關卡 -->
<g stroke="#000" stroke-width="2">
<line x1="1180" y1="420" x2="1180" y2="500"/><rect x="1170" y="435" width="18" height="50" fill="#000"/>
<line x1="1210" y1="440" x2="1210" y2="520"/><rect x="1200" y="455" width="18" height="50" fill="#c0392b"/>
<line x1="1240" y1="460" x2="1240" y2="540"/><rect x="1230" y="475" width="18" height="50" fill="#000"/>
</g>
<rect x="1260" y="460" width="60" height="42" rx="18" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1275" y="487" font-size="20">空</text>
</svg>
