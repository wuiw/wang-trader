<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="560" fill="#ffffff"/>
  <rect x="10" y="10" width="620" height="540" fill="none" stroke="#1a2a6c" stroke-width="3"/>

  <!-- Title banner -->
  <rect x="40" y="30" width="500" height="70" fill="#e08a3c"/>
  <text x="60" y="58" font-size="22" font-weight="bold" fill="#c0102a">回檔找量最縮的K線，它的最高</text>
  <text x="60" y="88" font-size="22" font-weight="bold" fill="#c0102a">點被突破為買進訊號</text>

  <!-- support curve (red) -->
  <path d="M 90 430 C 260 430, 380 200, 470 130" fill="none" stroke="#c0102a" stroke-width="2.5"/>

  <!-- small choppy candles near baseline (left) -->
  <g stroke="#000000" stroke-width="2">
    <line x1="90" y1="380" x2="90" y2="430"/>
    <rect x="84" y="400" width="12" height="18" fill="#c0102a" stroke="#c0102a"/>
  </g>

  <!-- tall red up candle -->
  <g stroke="#c0102a" stroke-width="2">
    <line x1="160" y1="230" x2="160" y2="420"/>
    <rect x="150" y="240" width="20" height="150" fill="#ffffff" stroke="#c0102a" stroke-width="3"/>
  </g>

  <!-- descending black candles (量最縮, shrinking pullback) -->
  <g stroke="#000000" stroke-width="2">
    <line x1="210" y1="300" x2="210" y2="345"/>
    <rect x="200" y="305" width="20" height="30" fill="#000000"/>

    <line x1="250" y1="320" x2="250" y2="365"/>
    <rect x="240" y="325" width="20" height="30" fill="#000000"/>

    <line x1="290" y1="335" x2="290" y2="380"/>
    <rect x="280" y="340" width="20" height="30" fill="#000000"/>

    <line x1="330" y1="345" x2="330" y2="385"/>
    <rect x="320" y="350" width="20" height="25" fill="#000000"/>
  </g>

  <!-- breakout red candle -->
  <g stroke="#c0102a" stroke-width="2">
    <line x1="380" y1="150" x2="380" y2="360"/>
    <rect x="370" y="160" width="20" height="190" fill="#ffffff" stroke="#c0102a" stroke-width="3"/>
  </g>

  <!-- another small red candle to the right -->
  <g stroke="#c0102a" stroke-width="2">
    <line x1="440" y1="140" x2="440" y2="230"/>
    <rect x="430" y="150" width="20" height="70" fill="#ffffff" stroke="#c0102a" stroke-width="3"/>
  </g>

  <!-- arrow + 買 circle pointing at the breakout candle's high (highlighting the most-shrunk K line's high being broken) -->
  <line x1="560" y1="255" x2="405" y2="255" stroke="#2e6b3e" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="588" cy="255" r="22" fill="#ffffff" stroke="#c0102a" stroke-width="2.5"/>
  <text x="588" y="263" font-size="20" font-weight="bold" fill="#c0102a" text-anchor="middle">買</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e6b3e"/>
    </marker>
  </defs>

  <!-- baseline for chart -->
  <line x1="55" y1="430" x2="590" y2="430" stroke="#1a2a6c" stroke-width="2"/>

  <!-- volume baseline further below -->
  <line x1="55" y1="500" x2="590" y2="500" stroke="#1a2a6c" stroke-width="2.5"/>
  <!-- volume bars, tall at left, shrinking toward middle -->
  <g fill="#333333">
    <rect x="65" y="470" width="10" height="30"/>
    <rect x="80" y="460" width="10" height="40"/>
    <rect x="95" y="450" width="10" height="50"/>
    <rect x="150" y="440" width="10" height="60"/>
    <rect x="165" y="455" width="10" height="45"/>
    <rect x="210" y="475" width="10" height="25"/>
    <rect x="250" y="482" width="10" height="18"/>
    <rect x="290" y="488" width="10" height="12"/>
    <rect x="330" y="492" width="10" height="8"/>
  </g>
  <!-- dashed downward arrow over the shrinking volume bars -->
  <line x1="230" y1="450" x2="330" y2="488" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
</svg>
