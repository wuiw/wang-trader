<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="sans-serif">
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <rect x="8" y="8" width="1184" height="604" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">層級2轉折谷點</text>

  <!-- ===== Group A: 單谷 #1 ===== -->
  <g transform="translate(0,40)">
    <text x="120" y="30" text-anchor="middle" font-size="16" fill="#000000">單谷</text>
    <!-- candles pos2,1,0,1,2 : trough (0) lowest on page (largest y) -->
    <line x1="45" y1="60" x2="45" y2="120" stroke="#333"/>
    <rect x="37" y="65" width="16" height="45" fill="#111111"/>
    <line x1="80" y1="80" x2="80" y2="150" stroke="#333"/>
    <rect x="72" y="88" width="16" height="45" fill="#111111"/>
    <line x1="120" y1="120" x2="120" y2="210" stroke="#333"/>
    <rect x="112" y="130" width="16" height="65" fill="#d0342c"/>
    <line x1="160" y1="100" x2="160" y2="170" stroke="#333"/>
    <rect x="152" y="108" width="16" height="45" fill="#d0342c"/>
    <line x1="195" y1="80" x2="195" y2="150" stroke="#333"/>
    <rect x="187" y="88" width="16" height="45" fill="#d0342c"/>
    <text x="45" y="45" text-anchor="middle" font-size="13">②</text>
    <text x="80" y="65" text-anchor="middle" font-size="13">①</text>
    <text x="120" y="225" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="160" y="190" text-anchor="middle" font-size="13">①</text>
    <text x="195" y="165" text-anchor="middle" font-size="13">②</text>
  </g>

  <!-- ===== Group B: 單谷 #2 ===== -->
  <g transform="translate(260,40)">
    <text x="120" y="30" text-anchor="middle" font-size="16" fill="#000000">單谷</text>
    <line x1="50" y1="60" x2="50" y2="130" stroke="#333"/>
    <rect x="42" y="65" width="16" height="50" fill="#111111"/>
    <line x1="85" y1="80" x2="85" y2="140" stroke="#333"/>
    <rect x="77" y="86" width="16" height="35" fill="#d0342c"/>
    <line x1="120" y1="120" x2="120" y2="215" stroke="#333"/>
    <rect x="112" y="128" width="16" height="70" fill="#111111"/>
    <line x1="155" y1="90" x2="155" y2="160" stroke="#333"/>
    <rect x="147" y="98" width="16" height="45" fill="#d0342c"/>
    <line x1="190" y1="70" x2="190" y2="140" stroke="#333"/>
    <rect x="182" y="78" width="16" height="45" fill="#111111"/>
    <text x="50" y="45" text-anchor="middle" font-size="13">②</text>
    <text x="85" y="65" text-anchor="middle" font-size="13">①</text>
    <text x="120" y="230" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="155" y="175" text-anchor="middle" font-size="13">①</text>
    <text x="190" y="55" text-anchor="middle" font-size="13">②</text>
  </g>

  <!-- ===== Group C: 雙谷 ===== -->
  <g transform="translate(560,40)">
    <text x="140" y="30" text-anchor="middle" font-size="16" fill="#000000">雙谷</text>
    <line x1="35" y1="60" x2="35" y2="125" stroke="#333"/>
    <rect x="27" y="65" width="16" height="45" fill="#111111"/>
    <line x1="70" y1="85" x2="70" y2="155" stroke="#333"/>
    <rect x="62" y="92" width="16" height="50" fill="#111111"/>
    <line x1="110" y1="120" x2="110" y2="210" stroke="#333"/>
    <rect x="102" y="128" width="16" height="65" fill="#111111"/>
    <line x1="150" y1="120" x2="150" y2="210" stroke="#333"/>
    <rect x="142" y="128" width="16" height="65" fill="#d0342c"/>
    <line x1="190" y1="90" x2="190" y2="160" stroke="#333"/>
    <rect x="182" y="98" width="16" height="45" fill="#d0342c"/>
    <line x1="225" y1="65" x2="225" y2="130" stroke="#333"/>
    <rect x="217" y="70" width="16" height="45" fill="#d0342c"/>
    <text x="35" y="45" text-anchor="middle" font-size="13">②</text>
    <text x="70" y="70" text-anchor="middle" font-size="13">①</text>
    <text x="110" y="225" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="150" y="225" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="190" y="175" text-anchor="middle" font-size="13">①</text>
    <text x="225" y="50" text-anchor="middle" font-size="13">②</text>
  </g>

  <!-- ===== Group D: 三谷 ===== -->
  <g transform="translate(900,40)">
    <text x="150" y="30" text-anchor="middle" font-size="16" fill="#000000">三谷</text>
    <line x1="45" y1="60" x2="45" y2="125" stroke="#333"/>
    <rect x="37" y="65" width="16" height="45" fill="#111111"/>
    <line x1="80" y1="85" x2="80" y2="155" stroke="#333"/>
    <rect x="72" y="92" width="16" height="50" fill="#111111"/>
    <line x1="115" y1="120" x2="115" y2="210" stroke="#333"/>
    <rect x="107" y="128" width="16" height="65" fill="#111111"/>
    <line x1="150" y1="120" x2="150" y2="210" stroke="#333"/>
    <rect x="142" y="128" width="16" height="65" fill="#111111"/>
    <line x1="185" y1="120" x2="185" y2="210" stroke="#333"/>
    <rect x="177" y="128" width="16" height="65" fill="#d0342c"/>
    <line x1="220" y1="90" x2="220" y2="160" stroke="#333"/>
    <rect x="212" y="98" width="16" height="45" fill="#d0342c"/>
    <line x1="255" y1="65" x2="255" y2="130" stroke="#333"/>
    <rect x="247" y="70" width="16" height="45" fill="#111111"/>
    <text x="45" y="45" text-anchor="middle" font-size="13">②</text>
    <text x="80" y="70" text-anchor="middle" font-size="13">①</text>
    <text x="115" y="225" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="150" y="225" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="185" y="225" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="220" y="175" text-anchor="middle" font-size="13">①</text>
    <text x="255" y="50" text-anchor="middle" font-size="13">②</text>
  </g>

  <!-- ===== Group E: 縮腳變形雙谷 (small unlabeled gap candle between the two tied troughs) ===== -->
  <g transform="translate(120,330)">
    <text x="140" y="30" text-anchor="middle" font-size="16" fill="#000000">縮腳變形雙谷</text>
    <line x1="20" y1="60" x2="20" y2="125" stroke="#333"/>
    <rect x="12" y="65" width="16" height="45" fill="#111111"/>
    <line x1="55" y1="85" x2="55" y2="150" stroke="#333"/>
    <rect x="47" y="92" width="16" height="45" fill="#111111"/>
    <line x1="95" y1="120" x2="95" y2="210" stroke="#333"/>
    <rect x="87" y="128" width="16" height="65" fill="#111111"/>
    <!-- small unlabeled shrunken-leg gap candle -->
    <line x1="130" y1="150" x2="130" y2="175" stroke="#333"/>
    <rect x="123" y="155" width="14" height="12" fill="#d0342c"/>
    <line x1="185" y1="120" x2="185" y2="210" stroke="#333"/>
    <rect x="177" y="128" width="16" height="65" fill="#d0342c"/>
    <line x1="230" y1="90" x2="230" y2="160" stroke="#333"/>
    <rect x="222" y="98" width="16" height="45" fill="#d0342c"/>
    <line x1="265" y1="65" x2="265" y2="130" stroke="#333"/>
    <rect x="257" y="70" width="16" height="45" fill="#d0342c"/>
    <text x="20" y="45" text-anchor="middle" font-size="13">②</text>
    <text x="55" y="70" text-anchor="middle" font-size="13">①</text>
    <text x="95" y="225" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="185" y="225" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="230" y="175" text-anchor="middle" font-size="13">①</text>
    <text x="265" y="50" text-anchor="middle" font-size="13">②</text>
  </g>

  <!-- ===== Group F: 縮腳變形三谷 (gap candle among the three tied troughs) ===== -->
  <g transform="translate(560,330)">
    <text x="170" y="30" text-anchor="middle" font-size="16" fill="#000000">縮腳變形三谷</text>
    <line x1="45" y1="60" x2="45" y2="125" stroke="#333"/>
    <rect x="37" y="65" width="16" height="45" fill="#111111"/>
    <line x1="80" y1="85" x2="80" y2="155" stroke="#333"/>
    <rect x="72" y="92" width="16" height="50" fill="#111111"/>
    <line x1="115" y1="120" x2="115" y2="210" stroke="#333"/>
    <rect x="107" y="128" width="16" height="65" fill="#111111"/>
    <line x1="150" y1="120" x2="150" y2="210" stroke="#333"/>
    <rect x="142" y="128" width="16" height="65" fill="#111111"/>
    <!-- small unlabeled shrunken-leg gap candle -->
    <line x1="185" y1="150" x2="185" y2="175" stroke="#333"/>
    <rect x="178" y="155" width="14" height="12" fill="#d0342c"/>
    <line x1="220" y1="120" x2="220" y2="210" stroke="#333"/>
    <rect x="212" y="128" width="16" height="65" fill="#d0342c"/>
    <line x1="255" y1="90" x2="255" y2="160" stroke="#333"/>
    <rect x="247" y="98" width="16" height="45" fill="#d0342c"/>
    <line x1="290" y1="65" x2="290" y2="130" stroke="#333"/>
    <rect x="282" y="70" width="16" height="45" fill="#111111"/>
    <text x="45" y="45" text-anchor="middle" font-size="13">②</text>
    <text x="80" y="70" text-anchor="middle" font-size="13">①</text>
    <text x="115" y="225" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="150" y="225" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="220" y="225" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="255" y="175" text-anchor="middle" font-size="13">①</text>
    <text x="290" y="50" text-anchor="middle" font-size="13">②</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-size="18" fill="#000000">圖 1-3</text>
</svg>
