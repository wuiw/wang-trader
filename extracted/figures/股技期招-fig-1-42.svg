<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" font-family="sans-serif">
  <rect x="0" y="0" width="1400" height="560" fill="white"/>
  <rect x="4" y="4" width="1392" height="552" fill="none" stroke="black" stroke-width="2"/>

  <!-- yellow "constrained range" band covering the descending staircase of candles -->
  <rect x="60" y="40" width="1180" height="380" fill="#e9df8f" opacity="0.55"/>

  <!-- staircase of candles, trending down left to right, red=up black=down -->
  <!-- candle 0 (initial, outside pattern) -->
  <line x1="95" y1="60" x2="95" y2="140" stroke="black" stroke-width="2"/>
  <rect x="80" y="80" width="30" height="45" fill="black"/>

  <!-- candle group boxed pair near 1 -->
  <rect x="130" y="70" width="90" height="120" fill="none" stroke="#b5651d" stroke-width="1.5"/>
  <line x1="150" y1="65" x2="150" y2="150" stroke="black" stroke-width="2"/>
  <rect x="140" y="100" width="24" height="55" fill="#c0272d"/>
  <line x1="195" y1="75" x2="195" y2="155" stroke="black" stroke-width="2"/>
  <rect x="183" y="105" width="24" height="45" fill="#c0272d"/>
  <text x="220" y="60" font-size="22" text-anchor="middle">①</text>

  <!-- next black candle -->
  <line x1="245" y1="95" x2="245" y2="175" stroke="black" stroke-width="2"/>
  <rect x="230" y="110" width="30" height="45" fill="black"/>

  <!-- tall black candle -->
  <line x1="300" y1="110" x2="300" y2="260" stroke="black" stroke-width="2"/>
  <rect x="285" y="120" width="30" height="120" fill="black"/>

  <!-- red candle -->
  <line x1="350" y1="140" x2="350" y2="230" stroke="black" stroke-width="2"/>
  <rect x="335" y="150" width="30" height="65" fill="#c0272d"/>

  <!-- boxed pair near 2/3 -->
  <rect x="395" y="145" width="120" height="90" fill="none" stroke="#b5651d" stroke-width="1.5"/>
  <rect x="400" y="170" width="30" height="40" fill="black"/>
  <rect x="445" y="150" width="30" height="55" fill="black"/>
  <text x="460" y="120" font-size="22" text-anchor="middle">②</text>

  <rect x="490" y="175" width="30" height="15" fill="#c0272d"/>
  <text x="555" y="130" font-size="22" text-anchor="middle">③</text>
  <rect x="540" y="190" width="30" height="30" fill="black"/>
  <rect x="585" y="175" width="30" height="60" fill="black"/>

  <!-- descending further -->
  <line x1="660" y1="220" x2="660" y2="290" stroke="black" stroke-width="2"/>
  <rect x="645" y="235" width="30" height="35" fill="black"/>
  <rect x="695" y="250" width="30" height="30" fill="#c0272d"/>

  <!-- boxed pair near 4 -->
  <rect x="735" y="245" width="120" height="100" fill="none" stroke="#b5651d" stroke-width="1.5"/>
  <line x1="750" y1="240" x2="750" y2="330" stroke="black" stroke-width="2"/>
  <rect x="740" y="270" width="24" height="60" fill="black"/>
  <rect x="795" y="255" width="30" height="55" fill="#c0272d"/>
  <text x="800" y="225" font-size="22" text-anchor="middle">④</text>

  <text x="900" y="255" font-size="22" text-anchor="middle">⑤</text>
  <rect x="875" y="270" width="30" height="30" fill="black"/>
  <rect x="920" y="255" width="30" height="45" fill="#c0272d"/>

  <!-- final breakout red candle, outside/above the yellow band -->
  <line x1="1000" y1="130" x2="1000" y2="290" stroke="black" stroke-width="2"/>
  <rect x="985" y="140" width="34" height="120" fill="#c0272d"/>
  <text x="1000" y="110" font-size="24" text-anchor="middle" font-weight="bold">⑥</text>

  <!-- rising trend/support line under the staircase -->
  <path d="M60,420 C300,380 700,340 1150,150" fill="none" stroke="#8a6d3b" stroke-width="1.5"/>

  <!-- callout for breakout -->
  <rect x="1060" y="60" width="290" height="90" rx="8" fill="#e9e9e9" stroke="#888"/>
  <text x="1205" y="90" font-size="20" text-anchor="middle">向上破壞慣性，代表</text>
  <text x="1205" y="120" font-size="20" text-anchor="middle">一個潛在的向上變動</text>
  <line x1="1060" y1="105" x2="1020" y2="180" stroke="#888" stroke-width="1.5"/>

  <!-- caption text under chart -->
  <text x="700" y="480" font-size="24" text-anchor="middle">黃色區域內，無一K線收盤突破前二天區間最高點，</text>
  <text x="700" y="512" font-size="24" text-anchor="middle">這就是此區域內的價格慣性，直到標示⑥開始破壞慣性</text>
</svg>
