<text x="298" y="247" font-size="12">出場</text>
<path d="M 300 260 L 250 190" stroke="#666" stroke-width="1"/>
<text x="220" y="575" font-size="14" font-weight="bold" text-anchor="middle">以進場後創新高無遮蔽K線及其前一根K線低點孰低</text>
<text x="220" y="593" font-size="14" font-weight="bold" text-anchor="middle">為移動基礎之階梯停損停利出場線</text>

