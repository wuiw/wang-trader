<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="520" rx="6" fill="none" stroke="#3b3b7a" stroke-width="2"/>

  <!-- ===== LEFT: 連五黑遇首紅 (five black candles stepping down, then one small red) ===== -->
  <!-- candle 1 (highest, tallest) -->
  <rect x="120" y="90" width="46" height="110" fill="#000000"/>
  <!-- candle 2 -->
  <rect x="180" y="140" width="46" height="140" fill="#000000"/>
  <!-- candle 3 -->
  <rect x="240" y="200" width="46" height="150" fill="#000000"/>
  <!-- candle 4 -->
  <rect x="300" y="270" width="46" height="110" fill="#000000"/>
  <!-- candle 5 (lowest, shortest) -->
  <rect x="360" y="330" width="46" height="80" fill="#000000"/>
  <!-- 首紅 (first red candle, small, similar low level) -->
  <rect x="420" y="360" width="40" height="55" fill="#c81e1e"/>

  <text x="290" y="470" text-anchor="middle" font-size="28" font-weight="bold" fill="#111111">連五黑遇首紅</text>

  <!-- ===== RIGHT: 連五紅遇首黑 (five red candles stepping up, then one small black) ===== -->
  <!-- candle 1 (lowest, shortest) -->
  <rect x="560" y="330" width="46" height="80" fill="#c81e1e"/>
  <!-- candle 2 -->
  <rect x="620" y="270" width="46" height="110" fill="#c81e1e"/>
  <!-- candle 3 -->
  <rect x="680" y="200" width="46" height="150" fill="#c81e1e"/>
  <!-- candle 4 -->
  <rect x="740" y="140" width="46" height="140" fill="#c81e1e"/>
  <!-- candle 5 (highest, tallest) -->
  <rect x="800" y="90" width="46" height="110" fill="#c81e1e"/>
  <!-- 首黑 (first black candle, small, similar high level) -->
  <rect x="860" y="100" width="40" height="55" fill="#000000"/>

  <text x="730" y="470" text-anchor="middle" font-size="28" font-weight="bold" fill="#111111">連五紅遇首黑</text>

  <text x="500" y="590" text-anchor="middle" font-size="22" fill="#444444">圖 6-1</text>
</svg>
