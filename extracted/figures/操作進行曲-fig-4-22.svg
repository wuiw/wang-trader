<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <rect x="8" y="8" width="884" height="544" fill="none" stroke="#333333" stroke-width="1.5"/>

  <rect x="150" y="30" width="330" height="46" fill="#8fa8b8"/>
  <text x="315" y="60" font-size="24" font-weight="bold" fill="#c0392b" text-anchor="middle">移動停損停利的方式</text>

  <!-- downtrend zigzag: peak1(black) A/1(red,low) peak2(black) 2(red,low) peak3(black) 3(red,low) peak4(black) 4(red,low) B(exit,up) -->
  <polyline points="60,120 165,270 215,205 320,360 365,300 460,430 505,375 600,470 645,425 700,290"
            fill="none" stroke="#2e2a63" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- dashed lines -->
  <line x1="60" y1="270" x2="215" y2="270" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8,6"/>
  <line x1="505" y1="425" x2="700" y2="425" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8,6"/>

  <!-- black peak labels -->
  <circle cx="60" cy="120" r="16" fill="#1a1a1a"/>
  <text x="60" y="126" font-size="15" fill="#ffffff" text-anchor="middle">1</text>

  <circle cx="320" cy="205" r="16" fill="#1a1a1a"/>
  <text x="320" y="211" font-size="15" fill="#ffffff" text-anchor="middle">2</text>

  <circle cx="460" cy="300" r="16" fill="#1a1a1a"/>
  <text x="460" y="306" font-size="15" fill="#ffffff" text-anchor="middle">3</text>

  <circle cx="600" cy="375" r="16" fill="#1a1a1a"/>
  <text x="600" y="381" font-size="15" fill="#ffffff" text-anchor="middle">4</text>

  <!-- red-outlined trough labels -->
  <text x="215" y="235" font-size="20" font-weight="bold" fill="#c0392b" text-anchor="middle">A</text>
  <circle cx="215" cy="270" r="17" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="215" y="276" font-size="15" fill="#c0392b" text-anchor="middle">1</text>

  <circle cx="365" cy="300" r="17" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="365" y="306" font-size="15" fill="#c0392b" text-anchor="middle">2</text>

  <circle cx="505" cy="375" r="17" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="505" y="381" font-size="15" fill="#c0392b" text-anchor="middle">3</text>

  <circle cx="645" cy="425" r="17" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="645" y="431" font-size="15" fill="#c0392b" text-anchor="middle">4</text>

  <!-- exit B -->
  <text x="705" y="270" font-size="20" font-weight="bold" fill="#c0392b" text-anchor="middle">B</text>

  <!-- short entry label -->
  <text x="60" y="330" font-size="26" font-weight="bold" fill="#4a1010" text-anchor="middle">空</text>
  <path d="M 100 320 L 195 260" stroke="#2e6b4f" stroke-width="5" fill="none" marker-end="url(#arrowGreen2)"/>

  <defs>
    <marker id="arrowGreen2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e6b4f"/>
    </marker>
    <marker id="arrowRed2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="450" y="530" font-size="18" text-anchor="middle" fill="#1a1a1a">圖 4-22</text>
</svg>
