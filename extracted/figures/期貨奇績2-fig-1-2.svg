<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="sans-serif">
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <rect x="8" y="8" width="1184" height="604" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">層級2轉折峰點</text>

  <!-- reusable candle macro done manually per group -->
  <!-- ===== Group A: 單峰 (peak candle tallest, both sides symmetric colors red/black) ===== -->
  <g>
    <text x="120" y="70" text-anchor="middle" font-size="16" fill="#000000">單峰</text>
    <!-- labels -->
    <text x="120" y="95" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="80" y="115" text-anchor="middle" font-size="13">①</text>
    <text x="160" y="115" text-anchor="middle" font-size="13">①</text>
    <text x="45" y="135" text-anchor="middle" font-size="13">②</text>
    <text x="195" y="135" text-anchor="middle" font-size="13">②</text>
    <!-- candles: pos2,1,0,1,2 -->
    <line x1="45" y1="150" x2="45" y2="230" stroke="#333"/>
    <rect x="37" y="160" width="16" height="55" fill="#d0342c"/>
    <line x1="80" y1="130" x2="80" y2="210" stroke="#333"/>
    <rect x="72" y="140" width="16" height="55" fill="#d0342c"/>
    <line x1="120" y1="100" x2="120" y2="180" stroke="#333"/>
    <rect x="112" y="108" width="16" height="65" fill="#d0342c"/>
    <line x1="160" y1="140" x2="160" y2="200" stroke="#333"/>
    <rect x="152" y="150" width="16" height="35" fill="#111111"/>
    <line x1="195" y1="150" x2="195" y2="215" stroke="#333"/>
    <rect x="187" y="160" width="16" height="40" fill="#111111"/>
  </g>

  <!-- ===== Group B: 單峰 (second variant, alternating colors) ===== -->
  <g transform="translate(260,0)">
    <text x="120" y="70" text-anchor="middle" font-size="16" fill="#000000">單峰</text>
    <text x="120" y="95" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="85" y="115" text-anchor="middle" font-size="13">①</text>
    <text x="155" y="115" text-anchor="middle" font-size="13">①</text>
    <text x="50" y="135" text-anchor="middle" font-size="13">②</text>
    <text x="190" y="135" text-anchor="middle" font-size="13">②</text>
    <line x1="50" y1="165" x2="50" y2="215" stroke="#333"/>
    <rect x="42" y="172" width="16" height="35" fill="#d0342c"/>
    <line x1="85" y1="175" x2="85" y2="220" stroke="#333"/>
    <rect x="77" y="182" width="16" height="22" fill="#111111"/>
    <line x1="120" y1="100" x2="120" y2="185" stroke="#333"/>
    <rect x="112" y="108" width="16" height="65" fill="#d0342c"/>
    <line x1="155" y1="150" x2="155" y2="210" stroke="#333"/>
    <rect x="147" y="158" width="16" height="45" fill="#111111"/>
    <line x1="190" y1="120" x2="190" y2="190" stroke="#333"/>
    <rect x="182" y="128" width="16" height="45" fill="#d0342c"/>
  </g>

  <!-- ===== Group C: 雙峰 (two tied peaks, labels 0,0) ===== -->
  <g transform="translate(560,0)">
    <text x="140" y="70" text-anchor="middle" font-size="16" fill="#000000">雙峰</text>
    <text x="110" y="95" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="150" y="95" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="190" y="115" text-anchor="middle" font-size="13">①</text>
    <text x="70" y="115" text-anchor="middle" font-size="13">①</text>
    <text x="35" y="135" text-anchor="middle" font-size="13">②</text>
    <text x="225" y="135" text-anchor="middle" font-size="13">②</text>
    <line x1="35" y1="165" x2="35" y2="230" stroke="#333"/>
    <rect x="27" y="172" width="16" height="55" fill="#d0342c"/>
    <line x1="70" y1="140" x2="70" y2="210" stroke="#333"/>
    <rect x="62" y="148" width="16" height="55" fill="#d0342c"/>
    <line x1="110" y1="100" x2="110" y2="190" stroke="#333"/>
    <rect x="102" y="108" width="16" height="65" fill="#d0342c"/>
    <line x1="150" y1="100" x2="150" y2="190" stroke="#333"/>
    <rect x="142" y="108" width="16" height="65" fill="#111111"/>
    <line x1="190" y1="140" x2="190" y2="210" stroke="#333"/>
    <rect x="182" y="148" width="16" height="45" fill="#111111"/>
    <line x1="225" y1="165" x2="225" y2="230" stroke="#333"/>
    <rect x="217" y="172" width="16" height="55" fill="#111111"/>
  </g>

  <!-- ===== Group D: 三峰 (three tied peaks, labels 0,0,0) ===== -->
  <g transform="translate(900,0)">
    <text x="150" y="70" text-anchor="middle" font-size="16" fill="#000000">三峰</text>
    <text x="115" y="95" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="150" y="95" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="185" y="95" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="80" y="115" text-anchor="middle" font-size="13">①</text>
    <text x="220" y="115" text-anchor="middle" font-size="13">①</text>
    <text x="45" y="135" text-anchor="middle" font-size="13">②</text>
    <text x="255" y="135" text-anchor="middle" font-size="13">②</text>
    <line x1="45" y1="165" x2="45" y2="230" stroke="#333"/>
    <rect x="37" y="172" width="16" height="55" fill="#d0342c"/>
    <line x1="80" y1="140" x2="80" y2="210" stroke="#333"/>
    <rect x="72" y="148" width="16" height="55" fill="#111111"/>
    <line x1="115" y1="100" x2="115" y2="190" stroke="#333"/>
    <rect x="107" y="108" width="16" height="65" fill="#d0342c"/>
    <line x1="150" y1="100" x2="150" y2="190" stroke="#333"/>
    <rect x="142" y="108" width="16" height="65" fill="#d0342c"/>
    <line x1="185" y1="100" x2="185" y2="190" stroke="#333"/>
    <rect x="177" y="108" width="16" height="65" fill="#111111"/>
    <line x1="220" y1="140" x2="220" y2="210" stroke="#333"/>
    <rect x="212" y="148" width="16" height="45" fill="#111111"/>
    <line x1="255" y1="165" x2="255" y2="230" stroke="#333"/>
    <rect x="247" y="172" width="16" height="55" fill="#111111"/>
  </g>

  <!-- ===== Group E: 變形雙峰 (deformed double peak, small unlabeled gap candle between the two tied peaks) ===== -->
  <g transform="translate(120,330)">
    <text x="140" y="30" text-anchor="middle" font-size="16" fill="#000000">變形雙峰</text>
    <text x="95" y="55" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="185" y="55" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="230" y="75" text-anchor="middle" font-size="13">①</text>
    <text x="55" y="75" text-anchor="middle" font-size="13">①</text>
    <text x="20" y="95" text-anchor="middle" font-size="13">②</text>
    <text x="265" y="95" text-anchor="middle" font-size="13">②</text>
    <line x1="20" y1="125" x2="20" y2="190" stroke="#333"/>
    <rect x="12" y="132" width="16" height="55" fill="#d0342c"/>
    <line x1="55" y1="100" x2="55" y2="170" stroke="#333"/>
    <rect x="47" y="108" width="16" height="55" fill="#d0342c"/>
    <line x1="95" y1="60" x2="95" y2="150" stroke="#333"/>
    <rect x="87" y="68" width="16" height="65" fill="#d0342c"/>
    <!-- small unlabeled shrunken-leg gap candle -->
    <line x1="130" y1="95" x2="130" y2="120" stroke="#333"/>
    <rect x="123" y="100" width="14" height="12" fill="#111111"/>
    <line x1="185" y1="60" x2="185" y2="150" stroke="#333"/>
    <rect x="177" y="68" width="16" height="65" fill="#111111"/>
    <line x1="230" y1="100" x2="230" y2="170" stroke="#333"/>
    <rect x="222" y="108" width="16" height="55" fill="#111111"/>
    <line x1="265" y1="125" x2="265" y2="190" stroke="#333"/>
    <rect x="257" y="132" width="16" height="55" fill="#d0342c"/>
  </g>

  <!-- ===== Group F: 變形三峰 (deformed triple peak, small unlabeled gap candle among the three tied peaks) ===== -->
  <g transform="translate(560,330)">
    <text x="180" y="30" text-anchor="middle" font-size="16" fill="#000000">變形三峰</text>
    <text x="115" y="55" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="150" y="55" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="225" y="55" text-anchor="middle" font-size="13">Ⓞ</text>
    <text x="80" y="75" text-anchor="middle" font-size="13">①</text>
    <text x="260" y="75" text-anchor="middle" font-size="13">①</text>
    <text x="45" y="95" text-anchor="middle" font-size="13">②</text>
    <text x="295" y="95" text-anchor="middle" font-size="13">②</text>
    <line x1="45" y1="125" x2="45" y2="190" stroke="#333"/>
    <rect x="37" y="132" width="16" height="55" fill="#d0342c"/>
    <line x1="80" y1="100" x2="80" y2="170" stroke="#333"/>
    <rect x="72" y="108" width="16" height="55" fill="#d0342c"/>
    <line x1="115" y1="60" x2="115" y2="150" stroke="#333"/>
    <rect x="107" y="68" width="16" height="65" fill="#d0342c"/>
    <line x1="150" y1="60" x2="150" y2="150" stroke="#333"/>
    <rect x="142" y="68" width="16" height="65" fill="#111111"/>
    <!-- small unlabeled shrunken-leg gap candle -->
    <line x1="185" y1="95" x2="185" y2="118" stroke="#333"/>
    <rect x="178" y="100" width="14" height="12" fill="#111111"/>
    <line x1="225" y1="60" x2="225" y2="150" stroke="#333"/>
    <rect x="217" y="68" width="16" height="65" fill="#d0342c"/>
    <line x1="260" y1="100" x2="260" y2="170" stroke="#333"/>
    <rect x="252" y="108" width="16" height="55" fill="#111111"/>
    <line x1="295" y1="125" x2="295" y2="190" stroke="#333"/>
    <rect x="287" y="132" width="16" height="55" fill="#111111"/>
  </g>

  <text x="600" y="600" text-anchor="middle" font-size="18" fill="#000000">圖 1-2</text>
</svg>
