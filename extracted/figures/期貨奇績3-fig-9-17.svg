<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" font-family="sans-serif">
  <rect x="0" y="0" width="1400" height="560" fill="#ffffff"/>

  <!-- left vertical axis -->
  <line x1="60" y1="60" x2="60" y2="440" stroke="#4a7a8c" stroke-width="3"/>

  <!-- +20 and -20 dashed reference lines -->
  <line x1="60" y1="180" x2="1360" y2="180" stroke="#a05a2c" stroke-width="1.5"/>
  <line x1="60" y1="340" x2="1360" y2="340" stroke="#a05a2c" stroke-width="1.5"/>
  <text x="330" y="172" font-size="16" fill="#000000">距離平盤20點</text>
  <text x="90" y="360" font-size="16" fill="#000000">距離平盤20點</text>
  <line x1="150" y1="185" x2="150" y2="335" stroke="#a05a2c" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="440" y1="185" x2="440" y2="335" stroke="#a05a2c" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 平盤 line: yellow highlight band + green line -->
  <rect x="60" y="254" width="1300" height="12" fill="#f0d95a"/>
  <line x1="60" y1="260" x2="1360" y2="260" stroke="#2e7d32" stroke-width="3"/>
  <text x="640" y="250" font-size="18" fill="#000000">平盤</text>

  <!-- numbered circle headers -->
  <circle cx="150" cy="90" r="26" fill="#4b2e6e"/>
  <text x="150" y="98" text-anchor="middle" font-size="24" fill="#ffffff" font-weight="bold">1</text>
  <circle cx="480" cy="90" r="26" fill="#4b2e6e"/>
  <text x="480" y="98" text-anchor="middle" font-size="24" fill="#ffffff" font-weight="bold">2</text>
  <circle cx="810" cy="90" r="26" fill="#4b2e6e"/>
  <text x="810" y="98" text-anchor="middle" font-size="24" fill="#ffffff" font-weight="bold">3</text>
  <circle cx="1160" cy="90" r="26" fill="#4b2e6e"/>
  <text x="1160" y="98" text-anchor="middle" font-size="24" fill="#ffffff" font-weight="bold">4</text>

  <!-- helper candle rectangles: x,y(top),h,color -->
  <!-- PANEL 1: descending from above 平盤, A dips below (-20 line), B closes back above -->
  <g>
    <rect x="80"  y="135" width="20" height="55" fill="#c0272d"/>
    <rect x="105" y="150" width="20" height="45" fill="#c0272d"/>
    <rect x="130" y="185" width="20" height="45" fill="#111111"/>
    <rect x="155" y="205" width="20" height="35" fill="#111111"/>
    <rect x="180" y="215" width="20" height="25" fill="#c0272d"/>
    <rect x="205" y="240" width="20" height="80" fill="#111111"/>
    <text x="215" y="345" font-size="16" fill="#000000">A</text>
    <rect x="230" y="245" width="20" height="35" fill="#c0272d"/>
    <text x="255" y="235" font-size="16" fill="#000000">B</text>
  </g>

  <!-- PANEL 2: ascending from below -20 line, C closes above 平盤 (one bar only), D closes back below -->
  <g>
    <rect x="330" y="330" width="20" height="90" fill="#111111"/>
    <rect x="355" y="300" width="20" height="70" fill="#c0272d"/>
    <rect x="380" y="270" width="20" height="45" fill="#111111"/>
    <rect x="405" y="240" width="20" height="45" fill="#c0272d"/>
    <rect x="430" y="200" width="20" height="60" fill="#c0272d"/>
    <text x="410" y="195" font-size="16" fill="#000000">C</text>
    <rect x="455" y="235" width="20" height="30" fill="#111111"/>
    <text x="460" y="285" font-size="16" fill="#000000">D</text>
  </g>

  <!-- PANEL 3: ascending well above +20 line, E pulls back below 平盤, F closes back above -->
  <g>
    <rect x="660" y="210" width="20" height="50" fill="#c0272d"/>
    <rect x="685" y="175" width="20" height="45" fill="#c0272d"/>
    <rect x="710" y="150" width="20" height="40" fill="#111111"/>
    <rect x="735" y="190" width="20" height="45" fill="#111111"/>
    <rect x="760" y="235" width="20" height="35" fill="#111111"/>
    <text x="750" y="315" font-size="16" fill="#000000">E</text>
    <rect x="785" y="240" width="20" height="30" fill="#c0272d"/>
    <text x="805" y="230" font-size="16" fill="#000000">F</text>
  </g>

  <!-- PANEL 4: descending well below -20 line, G closes back above 平盤, H closes back below -->
  <g>
    <rect x="1010" y="150" width="20" height="45" fill="#c0272d"/>
    <rect x="1035" y="150" width="20" height="55" fill="#111111"/>
    <rect x="1060" y="205" width="20" height="45" fill="#111111"/>
    <rect x="1085" y="250" width="20" height="70" fill="#111111"/>
    <rect x="1110" y="320" width="20" height="55" fill="#111111"/>
    <rect x="1135" y="350" width="20" height="25" fill="#c0272d"/>
    <rect x="1160" y="290" width="20" height="60" fill="#c0272d"/>
    <text x="1150" y="280" font-size="16" fill="#000000">G</text>
    <rect x="1185" y="255" width="20" height="35" fill="#111111"/>
    <text x="1190" y="315" font-size="16" fill="#000000">H</text>
  </g>

  <rect x="60" y="60" width="1300" height="380" fill="none" stroke="#4a7a8c" stroke-width="2"/>

  <text x="700" y="480" text-anchor="middle" font-size="26" font-weight="bold" fill="#000000">蜻蜓點水訊號類型</text>
  <text x="700" y="530" text-anchor="middle" font-size="18" fill="#000000">圖 9-17</text>
</svg>
