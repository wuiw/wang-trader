<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">訊號基本模型</text>

  <!-- ========== LEFT PANEL: 買進模型 ========== -->
  <g>
    <!-- callout box -->
    <rect x="60" y="55" width="190" height="55" rx="10" fill="#ffffff" stroke="#8b2e1f" stroke-width="2"/>
    <text x="155" y="90" text-anchor="middle" font-size="18" fill="#8b2e1f" font-weight="bold">收盤突破買進</text>
    <line x1="155" y1="110" x2="215" y2="195" stroke="#8b2e1f" stroke-width="2"/>

    <!-- MA30 curve -->
    <path d="M 40,300 C 90,295 130,290 170,270 C 210,250 240,230 300,225 C 340,222 380,220 420,218"
          fill="none" stroke="#555555" stroke-width="2"/>
    <text x="45" y="290" font-size="16" fill="#333333">MA30</text>

    <!-- 層級2高轉折點峰位 dashed line -->
    <line x1="150" y1="195" x2="420" y2="195" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="45" y="185" font-size="15" fill="#000000">層級2高轉折點峰位</text>

    <!-- 層級2低轉折點谷位 label -->
    <text x="240" y="270" font-size="15" fill="#000000">層級2低轉折點谷位</text>
    <line x1="238" y1="260" x2="220" y2="248" stroke="#000000" stroke-width="1"/>

    <!-- candles: x, top(high), open, close, bottom(low), color -->
    <!-- helper: red = up close>open (fill #d0342c), black = down (fill #111111) -->
    <!-- 1 -->
    <line x1="60" y1="310" x2="60" y2="345" stroke="#111111"/>
    <rect x="53" y="312" width="14" height="20" fill="#111111"/>
    <!-- 2 -->
    <line x1="85" y1="315" x2="85" y2="350" stroke="#111111"/>
    <rect x="78" y="318" width="14" height="18" fill="#111111"/>
    <!-- 3 biggest black dip -->
    <line x1="110" y1="300" x2="110" y2="400" stroke="#111111"/>
    <rect x="103" y="305" width="14" height="70" fill="#111111"/>
    <!-- 4 red recover -->
    <line x1="135" y1="290" x2="135" y2="330" stroke="#d0342c"/>
    <rect x="128" y="295" width="14" height="22" fill="#d0342c"/>
    <!-- 5 red rally long wick -->
    <line x1="160" y1="220" x2="160" y2="300" stroke="#d0342c"/>
    <rect x="153" y="255" width="14" height="35" fill="#d0342c"/>
    <!-- 6 red continue -->
    <line x1="185" y1="215" x2="185" y2="260" stroke="#d0342c"/>
    <rect x="178" y="218" width="14" height="30" fill="#d0342c"/>
    <!-- 7 doji cross near MA30/peak area -->
    <line x1="210" y1="205" x2="210" y2="240" stroke="#111111"/>
    <line x1="203" y1="222" x2="217" y2="222" stroke="#111111"/>
    <!-- 8 black small pullback -->
    <line x1="235" y1="210" x2="235" y2="260" stroke="#111111"/>
    <rect x="228" y="215" width="14" height="30" fill="#111111"/>
    <!-- 9 red small -->
    <line x1="260" y1="205" x2="260" y2="245" stroke="#d0342c"/>
    <rect x="253" y="210" width="14" height="20" fill="#d0342c"/>
    <!-- 10 doji cross -->
    <line x1="285" y1="200" x2="285" y2="235" stroke="#111111"/>
    <line x1="278" y1="217" x2="292" y2="217" stroke="#111111"/>
    <!-- 11 black small (層級2低轉折點谷位) -->
    <line x1="310" y1="215" x2="310" y2="260" stroke="#111111"/>
    <rect x="303" y="220" width="14" height="30" fill="#111111"/>
    <!-- 12 red small -->
    <line x1="335" y1="205" x2="335" y2="240" stroke="#d0342c"/>
    <rect x="328" y="208" width="14" height="22" fill="#d0342c"/>
    <!-- 13 breakout red candle, closes above dashed line -->
    <line x1="360" y1="150" x2="360" y2="215" stroke="#d0342c"/>
    <rect x="353" y="160" width="14" height="45" fill="#d0342c"/>

    <text x="215" y="480" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">買進模型</text>
  </g>

  <!-- ========== RIGHT PANEL: 賣出模型 (mirrored) ========== -->
  <g>
    <!-- MA30 curve (mirrored: starts high, curves down then a small hump then resistance) -->
    <path d="M 560,215 C 610,213 650,215 690,225 C 730,235 760,255 800,275 C 840,290 870,295 900,300"
          fill="none" stroke="#555555" stroke-width="2"/>
    <text x="565" y="235" font-size="16" fill="#333333">MA30</text>

    <!-- 層級2高轉折點峰位 label (right side, near top hump after initial decline) -->
    <text x="760" y="255" font-size="15" fill="#000000">層級2高轉折點峰位</text>

    <!-- 層級2低轉折點谷位 dashed support line -->
    <line x1="600" y1="390" x2="900" y2="390" stroke="#000000" stroke-width="1.5"/>
    <text x="700" y="410" font-size="15" fill="#000000">層級2低轉折點谷位</text>

    <!-- callout box -->
    <rect x="780" y="415" width="190" height="55" rx="10" fill="#ffffff" stroke="#8b2e1f" stroke-width="2"/>
    <text x="875" y="450" text-anchor="middle" font-size="18" fill="#8b2e1f" font-weight="bold">收盤跌破放空</text>
    <line x1="875" y1="415" x2="900" y2="395" stroke="#8b2e1f" stroke-width="2"/>

    <!-- candles -->
    <!-- 1 red tall (top-left start) -->
    <line x1="565" y1="180" x2="565" y2="220" stroke="#d0342c"/>
    <rect x="558" y="185" width="14" height="30" fill="#d0342c"/>
    <!-- 2 red -->
    <line x1="590" y1="175" x2="590" y2="215" stroke="#d0342c"/>
    <rect x="583" y="178" width="14" height="25" fill="#d0342c"/>
    <!-- 3 red small dip cross -->
    <line x1="615" y1="180" x2="615" y2="230" stroke="#d0342c"/>
    <rect x="608" y="200" width="14" height="20" fill="#d0342c"/>
    <!-- 4 red tall peak with long upper wick -->
    <line x1="640" y1="150" x2="640" y2="230" stroke="#d0342c"/>
    <rect x="633" y="165" width="14" height="45" fill="#d0342c"/>
    <!-- 5 black turn down at peak -->
    <line x1="665" y1="160" x2="665" y2="260" stroke="#111111"/>
    <rect x="658" y="170" width="14" height="60" fill="#111111"/>
    <!-- 6 black tall decline -->
    <line x1="690" y1="225" x2="690" y2="330" stroke="#111111"/>
    <rect x="683" y="230" width="14" height="80" fill="#111111"/>
    <!-- 7 black small -->
    <line x1="715" y1="290" x2="715" y2="330" stroke="#111111"/>
    <rect x="708" y="295" width="14" height="25" fill="#111111"/>
    <!-- 8 red small recover -->
    <line x1="740" y1="285" x2="740" y2="325" stroke="#d0342c"/>
    <rect x="733" y="290" width="14" height="20" fill="#d0342c"/>
    <!-- 9 doji cross -->
    <line x1="765" y1="290" x2="765" y2="320" stroke="#111111"/>
    <line x1="758" y1="305" x2="772" y2="305" stroke="#111111"/>
    <!-- 10 red small -->
    <line x1="790" y1="285" x2="790" y2="325" stroke="#d0342c"/>
    <rect x="783" y="290" width="14" height="20" fill="#d0342c"/>
    <!-- 11 black small -->
    <line x1="815" y1="290" x2="815" y2="330" stroke="#111111"/>
    <rect x="808" y="295" width="14" height="22" fill="#111111"/>
    <!-- 12 doji cross -->
    <line x1="840" y1="290" x2="840" y2="320" stroke="#111111"/>
    <line x1="833" y1="305" x2="847" y2="305" stroke="#111111"/>
    <!-- 13 breakdown black candle, closes below support line -->
    <line x1="865" y1="330" x2="865" y2="400" stroke="#111111"/>
    <rect x="858" y="335" width="14" height="60" fill="#111111"/>

    <text x="785" y="480" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">賣出模型</text>
  </g>

  <rect x="10" y="10" width="980" height="540" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="540" text-anchor="middle" font-size="18" fill="#000000">圖 1-1</text>
</svg>
